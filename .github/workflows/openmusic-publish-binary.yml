name: OpenMusic Publish Binary
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish (x.x.x)
        default: 4.0.0
        required: true
      dry_run:
        description: Dry run
        required: true
        type: boolean
        default: true
      jobs:
        description: Jobs to run (flathub,aur,winget,chocolatey)
        required: true
        type: string
        default: "flathub,aur,winget,chocolatey"

jobs:
  flathub:
    runs-on: ubuntu-22.04
    if: contains(inputs.jobs, 'flathub')
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: MaybeItsAdam/io.github.MaybeItsAdam.OpenMusic
          token: ${{ secrets.FLATHUB_TOKEN }}

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: openmusic

      - name: Update flathub version
        run: |
          python3 openmusic/scripts/update_flathub_version.py ${{ inputs.version }}
          rm -rf openmusic
          git config --global user.email "noreply@github.com"
          git config --global user.name "MaybeItsAdam"
          git add .
          git commit -m "v${{ inputs.version }} Update"
          git branch update-${{ inputs.version }}
          git switch update-${{ inputs.version }}

      - name: Push to flathub
        if: ${{ !inputs.dry_run }}
        run: git push -u origin update-${{ inputs.version }}

  aur:
    runs-on: ubuntu-22.04
    if: contains(inputs.jobs, 'aur')
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dsaltares/fetch-gh-release-asset@aa2ab1243d6e0d5b405b973c89fa4d06a2d0fff7 # master
        with:
          version: tags/v${{ inputs.version }} # mind the "v" prefix
          file: openmusic-linux-${{inputs.version}}-x86_64.tar.xz
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update PKGBUILD versions
        run: |
          sed -i "s/%{{OPENMUSIC_VERSION}}%/${{ inputs.version }}/" aur-struct/PKGBUILD
          sed -i "s/%{{PKGREL}}%/1/" aur-struct/PKGBUILD
          sed -i "s/%{{LINUX_MD5}}%/`md5sum openmusic-linux-${{inputs.version}}-x86_64.tar.xz  | awk '{print $1}'`/" aur-struct/PKGBUILD

      - name: Release to AUR
        if: ${{ !inputs.dry_run }}
        uses: KSXGitHub/github-actions-deploy-aur@9dfe151cf48f26a957bbd0379c120e79cb990e13 # v2.7.2
        with:
          pkgname: openmusic-bin
          pkgbuild: aur-struct/PKGBUILD
          commit_username: ${{ secrets.AUR_USERNAME }}
          commit_email: ${{ secrets.AUR_EMAIL }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: Updated to v${{ inputs.version }}

  winget:
    runs-on: ubuntu-latest
    if: contains(inputs.jobs, 'winget')
    steps:
      - name: Release winget package
        if: ${{ !inputs.dry_run }}
        uses: vedantmgoyal9/winget-releaser@b3a5dae0047c6180023acba3f548c55fdf6b7193 # main
        with:
          version: ${{ inputs.version }}
          release-tag: v${{ inputs.version }}
          identifier: MaybeItsAdam.OpenMusic
          token: ${{ secrets.WINGET_TOKEN }}

  chocolatey:
    runs-on: windows-latest
    if: contains(inputs.jobs, 'chocolatey')
    steps:
      - uses: dsaltares/fetch-gh-release-asset@aa2ab1243d6e0d5b405b973c89fa4d06a2d0fff7 # master
        with:
          version: tags/v${{ inputs.version }} # mind the "v" prefix
          file: OpenMusic-windows-x86_64.nupkg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Chocolatey
        run: choco apikey -k ${{ secrets.CHOCO_API_KEY }} --source https://push.chocolatey.org/

      - name: Publish to Chocolatey Repository
        if: ${{ !inputs.dry_run }}
        run: choco push OpenMusic-windows-x86_64.nupkg --source https://push.chocolatey.org/

  playstore:
    runs-on: ubuntu-latest
    if: contains(inputs.jobs, 'playstore')
    steps:
      - name: Tagname (workflow dispatch)
        run: echo 'TAG_NAME=${{inputs.version}}' >> $GITHUB_ENV

