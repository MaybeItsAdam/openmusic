name: Tramline · Android
on:
  workflow_dispatch:
    inputs:
      tramline-input:
        description: "JSON from Tramline (version_name, version_code, commit_ref, build_notes)"
        required: false
        default: "{}"
concurrency:
  group: tramline-android-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
env:
  FLUTTER_VERSION: 3.35.2
  FLUTTER_CHANNEL: master
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Configure Tramline
        id: tramline
        uses: tramlinehq/deploy-action@v0.1.7
        with:
          input: ${{ github.event.inputs.tramline-input }}

      - name: Require Tramline version
        env:
          VERSION_NAME: ${{ steps.tramline.outputs.version_name }}
          VERSION_CODE: ${{ steps.tramline.outputs.version_code }}
        run: |
          if [ -z "$VERSION_NAME" ] || [ -z "$VERSION_CODE" ]; then
            echo "::error::No version_name/version_code in tramline-input — this workflow is meant to be triggered by Tramline."; exit 1
          fi

      - uses: subosito/flutter-action@f2c4f6686ca8e8d6e6d0f28410eeef506ed66aff # v2.18.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true
          git-source: https://github.com/flutter/flutter.git

      - name: Setup Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: "zulu"
          java-version: "17"
          cache: "gradle"
          check-latest: true

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable

      - name: Install Android dependencies
        run: |
          flutter pub get
          dart cli/cli.dart install-dependencies --platform=android --arch=all

      # envied generates lib/collections/env.g.dart from .env at build_runner
      # time, so .env must exist before codegen.
      - name: Write .env
        env:
          DOTENV: ${{ secrets.DOTENV_RELEASE }}
        run: printf '%s\nRELEASE_CHANNEL=stable\n' "$DOTENV" > .env

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      # android/app/build.gradle reads android/key.properties for release
      # signing (same secrets and paths as openmusic-release-binary.yml).
      - name: Write signing config
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}
          KEY_PROPERTIES: ${{ secrets.KEY_PROPERTIES }}
        run: |
          if [ -z "$KEYSTORE" ] || [ -z "$KEY_PROPERTIES" ]; then
            echo "::error::KEYSTORE / KEY_PROPERTIES secrets are not set — refusing to build an unsigned bundle."; exit 1
          fi
          printf '%s' "$KEYSTORE" | base64 --decode > android/app/upload-keystore.jks
          printf '%s\n' "$KEY_PROPERTIES" > android/key.properties

      - name: Build signed app bundle (stable flavor)
        env:
          VERSION_NAME: ${{ steps.tramline.outputs.version_name }}
          VERSION_CODE: ${{ steps.tramline.outputs.version_code }}
        run: |
          flutter build appbundle --release --flavor stable \
            --build-name="$VERSION_NAME" --build-number="$VERSION_CODE"

      - name: Remove signing secrets from disk
        if: always()
        run: rm -f android/app/upload-keystore.jks android/key.properties .env

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: openmusic-android-aab
          path: build/app/outputs/bundle/stableRelease/app-stable-release.aab
          retention-days: 7
          if-no-files-found: error
