name: OpenMusic Release Binary
on:
  workflow_dispatch:
    inputs:
      channel:
        type: choice
        options:
          - stable
          - nightly
        default: nightly
        description: The release channel
      debug:
        type: boolean
        default: false
        description: Debug with SSH toggle
        required: false
      dry_run:
        type: boolean
        default: false
        description: Dry run without uploading to release

env:
  FLUTTER_VERSION: 3.35.2
  FLUTTER_CHANNEL: master

# Least privilege by default; only the job that publishes a release widens it.
# build_platform builds artifacts and needs no write access to the repo.
permissions:
  contents: read

jobs:
  build_platform:
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux
            arch: x86
            files: |
              dist/OpenMusic-linux-x86_64.deb
              dist/OpenMusic-linux-x86_64.rpm
              dist/OpenMusic-linux-x86_64.AppImage
              dist/openmusic-linux-*-x86_64.tar.xz
          - os: ubuntu-22.04-arm
            platform: linux
            arch: arm64
            files: |
              dist/OpenMusic-linux-aarch64.deb
              dist/OpenMusic-linux-aarch64.AppImage
              dist/openmusic-linux-*-aarch64.tar.xz
          - os: ubuntu-22.04
            platform: android
            arch: all
            files: |
              build/OpenMusic-android-all-arch.apk
          - os: windows-latest
            platform: windows
            arch: x86
            files: |
              dist/OpenMusic-windows-x86_64.nupkg
              dist/OpenMusic-windows-x86_64-setup.exe
          - os: macos-14
            platform: ios
            arch: all
            files: |
              OpenMusic-iOS.ipa
          - os: macos-14
            platform: macos
            arch: all
            files: |
              build/OpenMusic-macos-universal.dmg
              build/OpenMusic-macos-universal.pkg
    runs-on: ${{matrix.os}}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: subosito/flutter-action@f2c4f6686ca8e8d6e6d0f28410eeef506ed66aff # v2.18.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION  }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true
          git-source: https://github.com/flutter/flutter.git

      # - name: free disk space
      #   if: ${{ matrix.platform == 'android' }}
      #   run: |
      #     sudo swapoff -a
      #     sudo rm -f /swapfile
      #     sudo apt clean
      #     docker rmi $(docker image ls -aq)
      #     df -h
      - name: Setup Java
        if: ${{matrix.platform == 'android'}}
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: "zulu"
          java-version: "17"
          cache: "gradle"
          check-latest: true

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable

      - name: Install Xcode
        if: ${{matrix.platform == 'ios'}}
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: "16.2"

      - name: Install ${{matrix.platform}} dependencies
        run: |
          flutter pub get
          dart cli/cli.dart install-dependencies --platform=${{matrix.platform}} --arch=${{matrix.arch}}

      - name: Sign Apk
        if: ${{matrix.platform == 'android'}}
        run: |
          echo '${{ secrets.KEYSTORE }}' | base64 --decode > android/app/upload-keystore.jks
          echo '${{ secrets.KEY_PROPERTIES }}' > android/key.properties

      - name: Build ${{matrix.platform}} binaries
        run: dart cli/cli.dart build --arch=${{matrix.arch}} ${{matrix.platform}}
        env:
          CHANNEL: ${{inputs.channel}}
          DOTENV: ${{secrets.DOTENV_RELEASE}}

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          if-no-files-found: error
          name: ${{matrix.platform}}-${{matrix.arch}}
          path: ${{matrix.files}}

      # The debug shell below opens in a job that has just written the signing
      # keystore and key.properties to disk. Remove them first so an
      # interactive session cannot read them back out.
      - name: Remove signing secrets from disk
        if: ${{ always() && matrix.platform == 'android' }}
        run: rm -f android/app/upload-keystore.jks android/key.properties

      - name: Debug With SSH When fails
        if: ${{ failure() && inputs.debug && inputs.channel == 'nightly' }}
        uses: mxschmitt/action-tmate@35b54afac29c97fb54faba5b513f8fbd1882f113 # v3
        timeout-minutes: 30
        with:
          limit-access-to-actor: true

  upload:
    runs-on: ubuntu-22.04
    permissions:
      contents: write # creates/updates the release
    needs:
      - build_platform
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: ./OpenMusic-Release-Binaries

      - name: Install dependencies
        run: sudo apt-get install tree -y

      - name: Generate Checksums
        run: |
          tree .
          find OpenMusic-Release-Binaries -type f -exec md5sum {} \; >> RELEASE.md5sum
          find OpenMusic-Release-Binaries -type f -exec sha256sum {} \; >> RELEASE.sha256sum
          sed -i 's|OpenMusic-Release-Binaries/.*/\([^/]*\)$|\1|' RELEASE.sha256sum RELEASE.md5sum
          sed -i 's|OpenMusic-Release-Binaries/||' RELEASE.sha256sum RELEASE.md5sum

      - name: Extract pubspec version
        run: |
          echo "PUBSPEC_VERSION=$(grep -oP 'version:\s*\K[^+]+(?=\+)' pubspec.yaml)" >> $GITHUB_ENV

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          if-no-files-found: error
          name: sums
          path: |
            RELEASE.md5sum
            RELEASE.sha256sum

      - name: Upload Release Binaries (stable)
        if: ${{ !inputs.dry_run && inputs.channel == 'stable' }}
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: v${{ env.PUBSPEC_VERSION }} # mind the "v" prefix
          omitBodyDuringUpdate: true
          omitNameDuringUpdate: true
          omitPrereleaseDuringUpdate: true
          allowUpdates: true
          artifacts: OpenMusic-Release-Binaries/**/*,RELEASE.sha256sum,RELEASE.md5sum

      - name: Upload Release Binaries (nightly)
        if: ${{ !inputs.dry_run && inputs.channel == 'nightly' }}
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: nightly
          omitBodyDuringUpdate: true
          omitNameDuringUpdate: true
          omitPrereleaseDuringUpdate: true
          allowUpdates: true
          artifacts: OpenMusic-Release-Binaries/**/*,RELEASE.sha256sum,RELEASE.md5sum
          body: |
            Build Number: ${{github.run_number}}

            Nightly release includes newest features but may contain bugs
            It is preferred to use the stable version unless you know what you're doing

      - name: Debug With SSH When fails
        if: ${{ failure() && inputs.debug && inputs.channel == 'nightly' }}
        uses: mxschmitt/action-tmate@35b54afac29c97fb54faba5b513f8fbd1882f113 # v3
        timeout-minutes: 30
        with:
          limit-access-to-actor: true
