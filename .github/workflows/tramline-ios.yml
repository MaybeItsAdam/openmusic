name: Tramline · iOS
on:
  workflow_dispatch:
    inputs:
      tramline-input:
        description: "JSON from Tramline (version_name, version_code, commit_ref, build_notes)"
        required: false
        default: "{}"
concurrency:
  group: tramline-ios-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
env:
  FLUTTER_VERSION: 3.35.2
  FLUTTER_CHANNEL: master
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Configure Tramline
        id: tramline
        uses: tramlinehq/deploy-action@v0.1.7
        with:
          input: ${{ github.event.inputs.tramline-input }}

      - name: Require Tramline version
        env:
          VERSION_NAME: ${{ steps.tramline.outputs.version_name }}
          VERSION_CODE: ${{ steps.tramline.outputs.version_code }}
        run: |
          if [ -z "$VERSION_NAME" ] || [ -z "$VERSION_CODE" ]; then
            echo "::error::No version_name/version_code in tramline-input — this workflow is meant to be triggered by Tramline."; exit 1
          fi

      - uses: subosito/flutter-action@f2c4f6686ca8e8d6e6d0f28410eeef506ed66aff # v2.18.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true
          git-source: https://github.com/flutter/flutter.git

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable

      # App Store Connect only accepts builds from the current Xcode SDK, so this
      # tracks the runner's latest stable Xcode rather than release-binary's 16.2.
      - name: Install Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: latest-stable

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Install iOS dependencies
        run: |
          flutter pub get
          dart cli/cli.dart install-dependencies --platform=ios --arch=all

      # envied generates lib/collections/env.g.dart from .env at build_runner
      # time, so .env must exist before codegen.
      - name: Write .env
        env:
          DOTENV: ${{ secrets.DOTENV_RELEASE }}
        run: printf '%s\nRELEASE_CHANNEL=stable\n' "$DOTENV" > .env

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build and upload to TestFlight
        env:
          VERSION_NAME: ${{ steps.tramline.outputs.version_name }}
          VERSION_CODE: ${{ steps.tramline.outputs.version_code }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
          TEAM_ID: "6NQNU5YSC2"
        run: bundle exec fastlane ios beta version_name:"$VERSION_NAME" version_code:"$VERSION_CODE"

      - name: Remove .env from disk
        if: always()
        run: rm -f .env
